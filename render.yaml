services:
  - type: web
    name: civic-connect-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_URL
        # Only a fallback for work that runs outside a request — a script or a
        # background job. Photograph URLs are otherwise built from the host each
        # request arrived on, so a wrong value here cannot break the app. Render
        # injects RENDER_EXTERNAL_URL, which takes precedence over this anyway.
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: AI_SERVICE_URL
        sync: false

  - type: web
    name: civic-connect-ai
    runtime: python
    plan: standard
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8