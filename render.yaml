services:
  - type: web
    name: civic-connect-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: AI_SERVICE_URL
        sync: false
    disk:
      name: civic-connect-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1