org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Kotlin's incremental compiler computes relative paths between the module and
# every source file. When the project and the Pub cache sit on different Windows
# drives (project on A:, cache on C:) it throws "this and base files have
# different roots" and the build fails outright. Disabling incremental Kotlin
# costs a little rebuild time and makes the build work from any drive.
kotlin.incremental=false
